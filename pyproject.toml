[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-chat-export-converter"
dynamic = ["version"]
description = "Offline ChatGPT and Claude export conversion tools"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
llm-chat-export = "llm_export_cli:main"

[tool.setuptools]
py-modules = ["llm_export_cli"]

[tool.setuptools.dynamic]
version = {attr = "llm_export_cli.__version__"}

[tool.setuptools.packages.find]
include = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
